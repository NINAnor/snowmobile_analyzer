[dependency-groups]
dev = [
  "deptry"
]

[project]
authors = [
  {name = "Benjamin Cretois", email = "benjamin.cretois@nina.no"}
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "Flask",
  "ftfy>=6.1",
  "google-auth",
  "google-cloud-storage",
  "librosa>=0.9",
  "numpy",
  "pillow",
  "pydub>=0.25",
  "python-dotenv",
  "pytorch-ignite>=0.4",
  "pytorch-lightning>=1.6",
  "pyyaml",
  "regex>=2022.4",
  "requests",
  "scipy",
  "termcolor>=1.1",
  "torch",
  "torchvision",
  "tqdm"
]
description = "A model to detect whether snowmobiles are present in an acoustic dataset."
license = {text = "MIT"}
name = "snowmobile_analyzer"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[tool.deptry]
# The vendored audioclip/ code and legacy analysis folders are kept as-is and
# are not scanned; their dependencies are intentionally declared.
extend_exclude = [
  "audioclip",
  "cloud_analysis",
  "cloud_function_directory",
  "example",
  "logs",
  "post_analysis",
  "yellowstone_analysis"
]
ignore = ["DEP002"]
known_first_party = ["utils"]

[tool.ruff]
extend-exclude = [
  "audioclip",
  "cloud_analysis",
  "cloud_function_directory",
  "example",
  "logs",
  "post_analysis",
  "yellowstone_analysis"
]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.ruff.lint.per-file-ignores]
# Legacy prediction modules: relaxed on style conventions.
"src/**" = ["E501", "LOG015", "PTH", "S101", "S506"]
